services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: franchises
      MYSQL_USER: franchises
      MYSQL_PASSWORD: franchises
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/franchises
      DB_USERNAME: franchises
      DB_PASSWORD: franchises
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
